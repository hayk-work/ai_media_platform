name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: backend:backend/api:backend/worker

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amp
          POSTGRES_PASSWORD: amp
          POSTGRES_DB: ai_media_platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+asyncpg://amp:amp@localhost:5433/ai_media_platform
        run: alembic upgrade head

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://amp:amp@localhost:5433/ai_media_platform
          DATABASE_URL: postgresql+asyncpg://amp:amp@localhost:5433/ai_media_platform
          JWT_SECRET: test-jwt-secret-with-32-bytes-minimum
          AI_MOCK_MODE: "true"
        run: pytest -q

      - name: Lint
        run: ruff check backend
