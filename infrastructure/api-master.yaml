AWSTemplateFormatVersion: "2010-09-09"
Description: Master stack for the AI Media Platform ECS API and async worker.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-media-platform

  ApiImageUri:
    Type: String
    Description: Full ECR image URI including tag.

  WorkerImageUri:
    Type: String
    Description: Full ECR worker image URI including tag.

  ApiDesiredCount:
    Type: Number
    Default: 1
    Description: Number of running API tasks.

  WorkerDesiredCount:
    Type: Number
    Default: 1
    Description: Number of running worker tasks.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for SNS processing notification subscription.

Resources:
  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ecr.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecr-stack

  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: rds.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnetIds:
          Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnetIds
        RdsSecurityGroupId:
          Fn::ImportValue: !Sub ${EnvironmentName}-RdsSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-rds-stack

  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: s3.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-s3-stack

  ProcessingStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: S3Stack
    Properties:
      TemplateURL: processing.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        MediaBucketName: !GetAtt S3Stack.Outputs.MediaBucketName
        MediaBucketArn: !GetAtt S3Stack.Outputs.MediaBucketArn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-processing-stack

  NotificationsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: notifications.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        NotificationEmail: !Ref NotificationEmail
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-notifications-stack

  EcsApiStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - RdsStack
      - S3Stack
    Properties:
      TemplateURL: ecs-api.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId:
          Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
        PublicSubnetIds:
          Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnetIds
        PrivateSubnetIds:
          Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnetIds
        AlbSecurityGroupId:
          Fn::ImportValue: !Sub ${EnvironmentName}-AlbSecurityGroupId
        ApiServiceSecurityGroupId:
          Fn::ImportValue: !Sub ${EnvironmentName}-ApiServiceSecurityGroupId
        EcsTaskExecutionRoleArn:
          Fn::ImportValue: !Sub ${EnvironmentName}-EcsTaskExecutionRoleArn
        EcsApiTaskRoleArn:
          Fn::ImportValue: !Sub ${EnvironmentName}-EcsApiTaskRoleArn
        ApiImageUri: !Ref ApiImageUri
        ApiDesiredCount: !Ref ApiDesiredCount
        DbHost: !GetAtt RdsStack.Outputs.DbEndpoint
        DbPort: !GetAtt RdsStack.Outputs.DbPort
        DatabaseSecretArn: !GetAtt RdsStack.Outputs.DatabaseSecretArn
        MediaBucketName: !GetAtt S3Stack.Outputs.MediaBucketName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-api-stack

  EcsWorkerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ProcessingStack
      - NotificationsStack
      - RdsStack
      - EcsApiStack
    Properties:
      TemplateURL: ecs-worker.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnetIds:
          Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnetIds
        WorkerServiceSecurityGroupId:
          Fn::ImportValue: !Sub ${EnvironmentName}-WorkerServiceSecurityGroupId
        EcsTaskExecutionRoleArn:
          Fn::ImportValue: !Sub ${EnvironmentName}-EcsTaskExecutionRoleArn
        EcsWorkerTaskRoleArn:
          Fn::ImportValue: !Sub ${EnvironmentName}-EcsWorkerTaskRoleArn
        WorkerImageUri: !Ref WorkerImageUri
        WorkerDesiredCount: !Ref WorkerDesiredCount
        ApiClusterName: !Sub ${EnvironmentName}-cluster
        DbHost: !GetAtt RdsStack.Outputs.DbEndpoint
        DbPort: !GetAtt RdsStack.Outputs.DbPort
        DatabaseSecretArn: !GetAtt RdsStack.Outputs.DatabaseSecretArn
        MediaBucketName: !GetAtt S3Stack.Outputs.MediaBucketName
        ProcessingQueueUrl: !GetAtt ProcessingStack.Outputs.ProcessingQueueUrl
        ProcessingNotificationTopicArn: !GetAtt NotificationsStack.Outputs.ProcessingNotificationTopicArn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-worker-stack

Outputs:
  ApiRepositoryUri:
    Description: ECR repository URI for the API image.
    Value: !GetAtt EcrStack.Outputs.ApiRepositoryUri
    Export:
      Name: !Sub ${EnvironmentName}-ApiRepositoryUri

  ApiLoadBalancerDnsName:
    Description: Public DNS name for the API load balancer.
    Value: !GetAtt EcsApiStack.Outputs.ApiLoadBalancerDnsName
    Export:
      Name: !Sub ${EnvironmentName}-ApiLoadBalancerDnsName

  ApiLoadBalancerUrl:
    Description: HTTP URL for the public API endpoint.
    Value: !GetAtt EcsApiStack.Outputs.ApiLoadBalancerUrl
    Export:
      Name: !Sub ${EnvironmentName}-ApiLoadBalancerUrl

  DbEndpoint:
    Description: RDS endpoint hostname.
    Value: !GetAtt RdsStack.Outputs.DbEndpoint
    Export:
      Name: !Sub ${EnvironmentName}-DbEndpoint

  ApiLogGroupName:
    Description: CloudWatch log group for API container logs.
    Value: !GetAtt EcsApiStack.Outputs.ApiLogGroupName
    Export:
      Name: !Sub ${EnvironmentName}-ApiLogGroupName

  MediaBucketName:
    Description: S3 bucket for original media uploads.
    Value: !GetAtt S3Stack.Outputs.MediaBucketName
    Export:
      Name: !Sub ${EnvironmentName}-MediaBucketName

  MediaBucketArn:
    Description: S3 bucket ARN for original media uploads.
    Value: !GetAtt S3Stack.Outputs.MediaBucketArn
    Export:
      Name: !Sub ${EnvironmentName}-MediaBucketArn

  ProcessingQueueUrl:
    Description: SQS queue URL for media processing jobs.
    Value: !GetAtt ProcessingStack.Outputs.ProcessingQueueUrl
    Export:
      Name: !Sub ${EnvironmentName}-ProcessingQueueUrl

  WorkerLogGroupName:
    Description: CloudWatch log group for worker container logs.
    Value: !GetAtt EcsWorkerStack.Outputs.WorkerLogGroupName
    Export:
      Name: !Sub ${EnvironmentName}-WorkerLogGroupName

  ProcessingNotificationTopicArn:
    Description: SNS topic ARN for media processing completion notifications.
    Value: !GetAtt NotificationsStack.Outputs.ProcessingNotificationTopicArn
    Export:
      Name: !Sub ${EnvironmentName}-ProcessingNotificationTopicArn
