AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role foundations for ECS task execution and application tasks.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-media-platform

Resources:
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-execution-role

  EcsApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-api-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiTaskLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-api-task-role

  EcsWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-worker-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerTaskLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-worker-task-role

Outputs:
  EcsTaskExecutionRoleArn:
    Description: Role used by ECS to pull images and write logs.
    Value: !GetAtt EcsTaskExecutionRole.Arn

  EcsApiTaskRoleArn:
    Description: Application role for the API ECS tasks.
    Value: !GetAtt EcsApiTaskRole.Arn

  EcsWorkerTaskRoleArn:
    Description: Application role for worker ECS tasks.
    Value: !GetAtt EcsWorkerTaskRole.Arn
