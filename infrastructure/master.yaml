AWSTemplateFormatVersion: "2010-09-09"
Description: Master stack for the AI Media Platform AWS network foundation.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-media-platform
    Description: Prefix used across nested stacks.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b

  BudgetLimitUsd:
    Type: Number
    Default: 50
    Description: Monthly AWS cost budget limit in USD.

  BudgetNotificationEmail:
    Type: String
    Default: ""
    Description: Optional email for budget alerts at 80% and 100% of the monthly limit.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: network.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-network-stack

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: security.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-security-stack

  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: iam.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-iam-stack

  CloudTrailStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: cloudtrail.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-cloudtrail-stack

  BudgetStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: budget.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        BudgetLimitUsd: !Ref BudgetLimitUsd
        BudgetNotificationEmail: !Ref BudgetNotificationEmail
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-budget-stack

Outputs:
  VpcId:
    Description: VPC identifier for ECS and RDS stacks.
    Value: !GetAtt NetworkStack.Outputs.VpcId
    Export:
      Name: !Sub ${EnvironmentName}-VpcId

  PublicSubnetIds:
    Description: Public subnets for the ALB.
    Value: !GetAtt NetworkStack.Outputs.PublicSubnetIds
    Export:
      Name: !Sub ${EnvironmentName}-PublicSubnetIds

  PrivateSubnetIds:
    Description: Private subnets for ECS and RDS.
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnetIds

  NatGatewayId:
    Description: NAT gateway for private subnet egress.
    Value: !GetAtt NetworkStack.Outputs.NatGatewayId
    Export:
      Name: !Sub ${EnvironmentName}-NatGatewayId

  AlbSecurityGroupId:
    Description: Security group for the ALB.
    Value: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
    Export:
      Name: !Sub ${EnvironmentName}-AlbSecurityGroupId

  ApiServiceSecurityGroupId:
    Description: Security group for API ECS tasks.
    Value: !GetAtt SecurityStack.Outputs.ApiServiceSecurityGroupId
    Export:
      Name: !Sub ${EnvironmentName}-ApiServiceSecurityGroupId

  WorkerServiceSecurityGroupId:
    Description: Security group for worker ECS tasks.
    Value: !GetAtt SecurityStack.Outputs.WorkerServiceSecurityGroupId
    Export:
      Name: !Sub ${EnvironmentName}-WorkerServiceSecurityGroupId

  RdsSecurityGroupId:
    Description: Security group for RDS PostgreSQL.
    Value: !GetAtt SecurityStack.Outputs.RdsSecurityGroupId
    Export:
      Name: !Sub ${EnvironmentName}-RdsSecurityGroupId

  EcsTaskExecutionRoleArn:
    Description: ECS task execution role ARN.
    Value: !GetAtt IamStack.Outputs.EcsTaskExecutionRoleArn
    Export:
      Name: !Sub ${EnvironmentName}-EcsTaskExecutionRoleArn

  EcsApiTaskRoleArn:
    Description: ECS API task role ARN.
    Value: !GetAtt IamStack.Outputs.EcsApiTaskRoleArn
    Export:
      Name: !Sub ${EnvironmentName}-EcsApiTaskRoleArn

  EcsWorkerTaskRoleArn:
    Description: ECS worker task role ARN.
    Value: !GetAtt IamStack.Outputs.EcsWorkerTaskRoleArn
    Export:
      Name: !Sub ${EnvironmentName}-EcsWorkerTaskRoleArn

  AuditBucketName:
    Description: S3 bucket storing CloudTrail audit logs.
    Value: !GetAtt CloudTrailStack.Outputs.AuditBucketName
    Export:
      Name: !Sub ${EnvironmentName}-AuditBucketName

  AuditTrailName:
    Description: CloudTrail trail name for management event auditing.
    Value: !GetAtt CloudTrailStack.Outputs.AuditTrailName
    Export:
      Name: !Sub ${EnvironmentName}-AuditTrailName

  BudgetName:
    Description: Monthly AWS cost budget name.
    Value: !GetAtt BudgetStack.Outputs.BudgetName
    Export:
      Name: !Sub ${EnvironmentName}-BudgetName
