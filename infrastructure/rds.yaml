AWSTemplateFormatVersion: "2010-09-09"
Description: PostgreSQL metadata database for the AI Media Platform API.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-media-platform

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for the DB subnet group.

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that allows API and worker access to PostgreSQL.

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/rds/credentials
      Description: Master credentials for the AI Media Platform PostgreSQL database.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"amp"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for AI Media Platform RDS.
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-db-subnet-group

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${EnvironmentName}-postgres
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: amp
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBName: ai_media_platform
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgres

Outputs:
  DbEndpoint:
    Description: RDS endpoint hostname for application connections.
    Value: !GetAtt DatabaseInstance.Endpoint.Address

  DbInstanceIdentifier:
    Description: RDS DB instance identifier for CloudWatch metric dimensions.
    Value: !Ref DatabaseInstance

  DbPort:
    Description: RDS endpoint port.
    Value: !GetAtt DatabaseInstance.Endpoint.Port

  DatabaseSecretArn:
    Description: Secrets Manager ARN for database credentials.
    Value: !Ref DatabaseSecret
