AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 bucket for original media uploads.

Parameters:
  EnvironmentName:
    Type: String
    Default: ai-media-platform

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-media-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireStaleUploadingObjects
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-media

  ApiMediaUploadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-api-s3-uploads
      Roles:
        - !Sub ${EnvironmentName}-ecs-api-task-role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub ${MediaBucket.Arn}/uploads/*

Outputs:
  MediaBucketName:
    Description: S3 bucket for original media uploads.
    Value: !Ref MediaBucket

  MediaBucketArn:
    Description: S3 bucket ARN.
    Value: !GetAtt MediaBucket.Arn
