[project]
name = "ai-media-platform"
version = "0.1.0"
description = "AI Media Processing Platform — upload, process, and analyze media with AWS."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.40.61",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-aws>=1.1.0",
    "langgraph>=1.2.6",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "email-validator>=2.2.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/api/tests", "backend/worker/tests", "infrastructure/tests"]
pythonpath = ["backend", "backend/api", "backend/worker"]
markers = [
    "integration: tests that require a running PostgreSQL database",
]

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
    "pyyaml>=6.0.2",
]
